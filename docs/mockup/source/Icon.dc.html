<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ไอคอนหมวดครุภัณฑ์</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<span style="{{wrap}}" title="{{title}}">
<sc-if value="{{isManikin}}" hint-placeholder-val="{{true}}"><svg width="{{inner}}" height="{{inner}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><circle cx="12" cy="5.5" r="2"></circle><path d="M12 9v5.5M8.5 11h7M12 14.5 9.5 20M12 14.5l2.5 5.5"></path></svg></sc-if>
<sc-if value="{{isMedical}}" hint-placeholder-val="{{false}}"><svg width="{{inner}}" height="{{inner}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M3.5 12h4l2-4.5 4 9 2-4.5h5"></path></svg></sc-if>
<sc-if value="{{isBed}}" hint-placeholder-val="{{false}}"><svg width="{{inner}}" height="{{inner}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M3.5 18V7M3.5 14h17v4M20.5 14v-1.5a2 2 0 0 0-2-2h-7v3.5"></path></svg></sc-if>
<sc-if value="{{isComputer}}" hint-placeholder-val="{{false}}"><svg width="{{inner}}" height="{{inner}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><rect x="4.5" y="5.5" width="15" height="10" rx="1"></rect><path d="M9 19h6M12 15.5V19"></path></svg></sc-if>
<sc-if value="{{isAv}}" hint-placeholder-val="{{false}}"><svg width="{{inner}}" height="{{inner}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><rect x="3.5" y="8" width="17" height="8.5" rx="1.5"></rect><circle cx="15.5" cy="12.25" r="2"></circle><path d="M6.5 12.25h3"></path></svg></sc-if>
<sc-if value="{{isFurniture}}" hint-placeholder-val="{{false}}"><svg width="{{inner}}" height="{{inner}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><rect x="6" y="3.5" width="12" height="17" rx="1"></rect><path d="M6 12h12M11 8h2M11 16h2"></path></svg></sc-if>
<sc-if value="{{isOther}}" hint-placeholder-val="{{false}}"><svg width="{{inner}}" height="{{inner}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M12 3.5 19.5 7.5v9L12 20.5 4.5 16.5v-9z"></path><path d="M4.5 7.5 12 11.5l7.5-4M12 11.5v9"></path></svg></sc-if>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["manikin","medical","bed","computer","av","furniture","other"],"default":"manikin"},"size":{"editor":"int","default":28,"min":16,"max":64},"$preview":{"width":48,"height":48}}'>
var ICON_COLORS = {
  manikin: ['#f1f4f5', '#2f3d43', 'หุ่นจำลอง'],
  medical: ['#f1f4f5', '#2f3d43', 'เครื่องมือแพทย์ที่ใช้สอน'],
  bed: ['#f1f4f5', '#2f3d43', 'เตียงและครุภัณฑ์ห้องฝึก'],
  computer: ['#f1f4f5', '#2f3d43', 'คอมพิวเตอร์'],
  av: ['#f1f4f5', '#2f3d43', 'โสตทัศนูปกรณ์'],
  furniture: ['#f1f4f5', '#2f3d43', 'สำนักงาน'],
  other: ['#f1f4f5', '#2f3d43', 'อื่น ๆ']
};
class Component extends DCLogic {
  renderVals() {
    var k = ICON_COLORS[this.props.kind] ? this.props.kind : (this.props.kind ? 'other' : 'manikin');
    var size = Number(this.props.size) || 28, c = ICON_COLORS[k];
    return {
      wrap: 'display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;box-sizing:border-box;width:' + size + 'px;height:' + size + 'px;border-radius:' + Math.round(size * 0.3) + 'px;background:' + c[0] + ';border:1px solid #e3e8ea;color:' + c[1],
      inner: Math.round(size * 0.62), title: c[2],
      isManikin: k === 'manikin', isMedical: k === 'medical', isBed: k === 'bed', isComputer: k === 'computer', isAv: k === 'av', isFurniture: k === 'furniture', isOther: k === 'other'
    };
  }
}
</script>
</body>
</html>
